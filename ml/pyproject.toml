[project]
name = "adhyayan-ml"
version = "0.1.0"
description = "Recommendation engine for Adhyayan: content, collaborative and learned ranking."
requires-python = ">=3.11"
dependencies = [
    "scikit-learn==1.9.0",
    "pandas>=2.3,<3",
    "numpy>=2,<3",
    "scipy>=1.13",
    "psycopg[binary]>=3.2",
    "joblib>=1.4",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["adhyayan_ml"]
